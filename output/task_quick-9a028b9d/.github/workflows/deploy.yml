name: 自動部署 - 創建電商網站

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 設置 Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'
    
    - name: 安裝依賴
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 執行測試
      run: |
        pytest tests/ -v --cov=src
    
    - name: 代碼品質檢查
      run: |
        flake8 src/ tests/
        black --check src/ tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 部署到伺服器
      run: |
        echo "🚀 部署到生產環境..."
